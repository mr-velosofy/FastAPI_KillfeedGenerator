<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KILLFEED GENERATOR</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="manifest" href="/static/favicon/site.webmanifest">
</head>

<body>
  <div class="container">
    <div class="val-header">
      <h1>Killfeed Generator</h1>
      <span class="sub">VALORANT</span>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" novalidate onsubmit="return validateForm();">
      <div class="form-grid">

        <div class="form-group">
          <label>Killer Name</label>
          <input name="killer_name" id="killer_name" value="{{ form.killer_name }}" placeholder="PLAYER">
          <div class="field-error" id="killer_name_error"></div>
        </div>

        <div class="form-group">
          <label>Victim Name</label>
          <input name="victim_name" id="victim_name" value="{{ form.victim_name }}" placeholder="PLAYER">
          <div class="field-error" id="victim_name_error"></div>
        </div>

        <div class="form-group">
          <label>Killer Agent</label>
          <select name="killer_agent">
            {% for agent in agents %}
            <option value="{{ agent }}" {% if form.killer_agent==agent %}selected{% endif %}>{{ agent }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Victim Agent</label>
          <select name="victim_agent">
            {% for agent in agents %}
            <option value="{{ agent }}" {% if form.victim_agent==agent %}selected{% endif %}>{{ agent }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Weapon / Ability</label>
          <div class="tab-bar">
            <button type="button" class="tab-btn active" data-tab="weapons">Weapons</button>
            <button type="button" class="tab-btn" data-tab="abilities">Abilities</button>
            <button type="button" class="tab-btn" data-tab="special">Special</button>
          </div>
          <select name="weapon" id="weapon-select"></select>
        </div>

        <div class="form-group">
          <label>Kill Count</label>
          <select name="numeral">
            <option value="">NONE</option>
            {% for n in ['3', '4', '5', '6', '7'] %}
            <option value="{{ n }}" {% if form.numeral==n %}selected{% endif %}>{{ n }}K</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group toggles">
          <div class="toggle-option">
            <label class="switch">
              <input type="checkbox" name="is_headshot" {% if form.is_headshot %}checked{% endif %}>
              <span class="slider"></span>
            </label>
            <span>Headshot</span>
          </div>

          <div class="toggle-option">
            <label class="switch">
              <input type="checkbox" name="is_wallbang" {% if form.is_wallbang %}checked{% endif %}>
              <span class="slider"></span>
            </label>
            <span>Wallbang</span>
          </div>

          <div class="toggle-option">
            <label class="switch">
              <input type="checkbox" name="is_player_kill" {% if form.is_player_kill %}checked{% endif %}>
              <span class="slider"></span>
            </label>
            <span>Me Highlight</span>
          </div>

          <div class="toggle-option">
            <label class="switch">
              <input type="checkbox" name="is_enemy_kill" {% if form.is_enemy_kill %}checked{% endif %}>
              <span class="slider"></span>
            </label>
            <span>Enemy Kill</span>
          </div>
        </div>

        <button type="submit" class="val-btn">Generate</button>
      </div>
    </form>

    {% if image_url %}
    <div class="preview">
      <h2>Preview</h2>
      <img src="{{ image_url }}" alt="Killfeed Image">
      <a href="/download/{{ image_filename }}"><button class="val-btn preview-btn">Download</button></a>
    </div>
    {% endif %}
    <div class="val-footer">made by mr_velosofy</div>
  </div>

  <script>
    var weaponsList = {{ weapons | tojson }};
    var abilitiesList = {{ abilities | tojson }};
    var specialList = {{ special | tojson }};
    var allTabs = { weapons: weaponsList, abilities: abilitiesList, special: specialList };
    var activeTab = "weapons";

    function displayName(path) {
      var name = path.split(/[/\\]/).pop();
      return name.replace(/\.png$/i, "").replace(/_/g, " ");
    }

    function detectTab(path) {
      if (/(^|[/\\])weapons[/\\]/.test(path)) return "weapons";
      if (/(^|[/\\])abilities[/\\]/.test(path)) return "abilities";
      if (/(^|[/\\])special[/\\]/.test(path)) return "special";
      return "weapons";
    }

    function populateSelect(tab) {
      var select = document.getElementById("weapon-select");
      select.innerHTML = "";
      var items = allTabs[tab] || [];
      items.forEach(function (item) {
        var opt = document.createElement("option");
        opt.value = item;
        opt.textContent = displayName(item);
        select.appendChild(opt);
      });
    }

    var tabButtons = document.querySelectorAll(".tab-btn");
    tabButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        tabButtons.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        activeTab = btn.getAttribute("data-tab");
        populateSelect(activeTab);
      });
    });

    var submittedWeapon = {{ form.get("weapon", none) | tojson }};
    if (submittedWeapon) {
      activeTab = detectTab(submittedWeapon);
    }
    populateSelect(activeTab);
    tabButtons.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === activeTab);
    });
    if (submittedWeapon) {
      document.getElementById("weapon-select").value = submittedWeapon;
    }

    function validateForm() {
      let valid = true;
      document.querySelectorAll(".field-error").forEach(el => el.innerText = "");
      const killerName = document.getElementById("killer_name").value.trim();
      const victimName = document.getElementById("victim_name").value.trim();

      if (!killerName) {
        document.getElementById("killer_name_error").innerText = "ENTER A KILLER NAME";
        valid = false;
      }
      if (!victimName) {
        document.getElementById("victim_name_error").innerText = "ENTER A VICTIM NAME";
        valid = false;
      }
      return valid;
    }
  </script>
</body>

</html>

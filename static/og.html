<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG IMAGE — Valorant Killfeed Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #060609;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    overflow: auto;
    font-family: 'Inter', system-ui, sans-serif;
  }
  canvas {
    width: min(94vw, 1400px);
    aspect-ratio: 16 / 9;
    display: block;
    border-radius: 12px;
    border: 1px solid #1c1c24;
    box-shadow: 0 0 80px rgba(255, 70, 85, .12), 0 30px 90px rgba(0, 0, 0, .6);
  }
  #cap {
    background: #ff4655; color: #fff;
    border: none; border-radius: 3px;
    padding: 13px 34px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: .12em;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255, 70, 85, .4);
    transition: filter .15s, transform .1s;
  }
  #cap:hover { filter: brightness(1.1); }
  #cap:active { transform: translateY(1px); }
  #cap:disabled { opacity: .55; cursor: wait; }
</style>
</head>
<body>
  <canvas id="cv" width="1600" height="900"></canvas>
  <button id="cap">SAVE IMAGE</button>

<script>
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height;

  /* ── assets ─────────────────────────────────────────── */
  var logo = new Image();
  var logoReady = new Promise(function (res) {
    logo.onload = res; logo.onerror = res;
    logo.src = "favicon/logo.svg";
  });

  var feeds = {};
  ["og-feed-enemy.png", "og-feed-revive.png", "og-feed-kill.png"].forEach(function (f) {
    var im = new Image();
    feeds[f] = im;
    im.src = "og-assets/" + f;
  });
  var feedsReady = Promise.all(Object.values(feeds).map(function (im) {
    return new Promise(function (res) { im.onload = res; im.onerror = res; });
  }));

  var fontsReady = Promise.race([
    Promise.all([
      document.fonts.load("800 94px Inter"),
      document.fonts.load("700 16px Inter"),
      document.fonts.load("600 15px Inter"),
      document.fonts.load("500 16px Inter"),
      document.fonts.load("400 19px Inter")
    ]),
    new Promise(function (res) { setTimeout(res, 1800); }) // never block forever offline
  ]);

  /* ── procedural film grain ──────────────────────────── */
  function grainTile(size, strength) {
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var g = c.getContext("2d");
    var d = g.createImageData(size, size);
    for (var i = 0; i < d.data.length; i += 4) {
      var v = Math.random() * 255 | 0;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 255 * strength;
    }
    g.putImageData(d, 0, 0);
    return c;
  }

  function chunky(tile, scale) { // upscale without smoothing -> fat visible grains
    var c = document.createElement("canvas");
    c.width = tile.width * scale;
    c.height = tile.height * scale;
    var g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(tile, 0, 0, c.width, c.height);
    return c;
  }

  var fineGrain = chunky(grainTile(180, 255), 1.5);   // ~3px grains everywhere
  var coarseGrain = chunky(grainTile(150, 255), 1.75); // ~6px grains for the edge vignette

  /* ── helpers ────────────────────────────────────────── */
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawSpaced(text, cx, baseY, ls) {
    var total = 0, i, w = [];
    for (i = 0; i < text.length; i++) {
      w.push(ctx.measureText(text[i]).width);
      total += w[i];
    }
    total += ls * (text.length - 1);
    var x = cx - total / 2;
    ctx.textAlign = "left";
    for (i = 0; i < text.length; i++) {
      ctx.fillText(text[i], x, baseY);
      x += w[i] + ls;
    }
    return total;
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x, y - s * 0.05, x - s * 0.5, y - s * 0.05, x - s * 0.5, y + s * 0.32);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.62, x - s * 0.12, y + s * 0.82, x, y + s * 1.0);
    ctx.bezierCurveTo(x + s * 0.12, y + s * 0.82, x + s * 0.5, y + s * 0.62, x + s * 0.5, y + s * 0.32);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 0.05, x, y - s * 0.05, x, y + s * 0.32);
    ctx.closePath();
  }

  function glowDot(cx, cy, r, rgb, a) {
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, "rgba(" + rgb + "," + a + ")");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }

  function drawFeed(img, cx, y, h, opts) {
    opts = opts || {};
    var w = h * (img.naturalWidth / img.naturalHeight);
    var x = cx - w / 2 + (opts.dx || 0);
    ctx.save();
    ctx.globalAlpha = opts.alpha != null ? opts.alpha : 1;
    if (opts.filter && "filter" in ctx) ctx.filter = opts.filter;
    if (opts.shadow) {
      ctx.shadowColor = opts.shadow[0];
      ctx.shadowBlur = opts.shadow[1];
      ctx.shadowOffsetY = opts.shadow[2];
    }
    ctx.drawImage(img, x, y, w, h);
    if (opts.shadow2) { // second pass: dark grounding shadow
      ctx.shadowColor = opts.shadow2[0];
      ctx.shadowBlur = opts.shadow2[1];
      ctx.shadowOffsetY = opts.shadow2[2];
      ctx.drawImage(img, x, y, w, h);
    }
    ctx.restore();
    return { x: x, y: y, w: w, h: h };
  }

  /* ── render ─────────────────────────────────────────── */
  function render() {
    // base
    var bg = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, H * 1.35);
    bg.addColorStop(0, "#111119");
    bg.addColorStop(.46, "#0a0a10");
    bg.addColorStop(1, "#08080c");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ambient glows @10%
    glowDot(800, 330, 470, "255,70,85", .10);   // behind headline
    glowDot(1740, 430, 430, "255,70,85", .10);  // right
    glowDot(-130, 510, 430, "255,70,85", .10);  // left
    glowDot(820, 1030, 460, "123,92,255", .10); // violet floor

    // brand row
    var brandFont = "600 15px Inter, system-ui, sans-serif";
    ctx.font = brandFont;
    var pre = "VALORANT ", post = " GENERATOR";
    var iconW = 34, gapI = 15;
    ctx.textBaseline = "alphabetic";
    var pw1 = 0, i, ch, adv = [];
    for (i = 0; i < pre.length; i++) { ch = ctx.measureText(pre[i]).width; adv.push(ch); pw1 += ch; }
    var pw3 = 0, adv3 = [];
    for (i = 0; i < post.length; i++) { ch = ctx.measureText(post[i]).width; adv3.push(ch); pw3 += ch; }
    var ls = 15 * .38;
    var totalW = iconW + gapI + pw1 + ls * (pre.length - 1) + pw3 + ls * (post.length - 1);
    var bx = W / 2 - totalW / 2, brandCy = 96;
    if (logo.complete && logo.naturalWidth > 0) {
      ctx.save();
      ctx.shadowColor = "rgba(255,70,85,.65)";
      ctx.shadowBlur = 16;
      ctx.drawImage(logo, bx, brandCy - iconW / 2, iconW, iconW);
      ctx.restore();
    }
    var tx = bx + iconW + gapI;
    ctx.textAlign = "left";
    ctx.fillStyle = "#aab1bd";
    for (i = 0; i < pre.length; i++) { ctx.fillText(pre[i], tx, brandCy + 5); tx += adv[i] + ls; }
    ctx.fillStyle = "#ff4655";
    ctx.fillText("KILLFEED", tx, brandCy + 5);
    tx += ctx.measureText("KILLFEED").width + ls;
    ctx.fillStyle = "#aab1bd";
    for (i = 0; i < post.length; i++) { ctx.fillText(post[i], tx, brandCy + 5); tx += adv3[i] + ls; }

    // headline
    ctx.textAlign = "center";
    ctx.font = "800 104px Inter, system-ui, sans-serif";
    ctx.fillStyle = "#f4f5f7";
    ctx.fillText("Craft Perfect", W / 2, 240);
    var l2 = "Valorant Killfeeds";
    var lw = ctx.measureText(l2).width;
    var lg = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    lg.addColorStop(.08, "#ff4655");
    lg.addColorStop(.55, "#ff7a59");
    lg.addColorStop(.95, "#ffb199");
    ctx.fillStyle = lg;
    ctx.fillText(l2, W / 2, 348);

    // sub-line
    ctx.font = "400 19px Inter, system-ui, sans-serif";
    ctx.fillStyle = "#adadad";
    ctx.fillText("Free browser-based generator for clips, thumbnails and memes.", W / 2, 392);

    // showcase container
    var scW = 1216, scH = 408, scX = W / 2 - scW / 2, scY = 428;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.9)";
    ctx.shadowBlur = 90;
    ctx.shadowOffsetY = 35;
    ctx.fillStyle = "#10101a";
    rr(ctx, scX, scY, scW, scH, 30);
    ctx.fill();
    ctx.restore();

    var cardGrad = ctx.createLinearGradient(0, scY, 0, scY + scH);
    cardGrad.addColorStop(0, "#12121a");
    cardGrad.addColorStop(1, "#0c0c13");
    ctx.fillStyle = cardGrad;
    rr(ctx, scX, scY, scW, scH, 30);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.08)";
    ctx.lineWidth = 1;
    rr(ctx, scX, scY, scW, scH, 30);
    ctx.stroke();

    // top edge light catch
    var ec = ctx.createLinearGradient(scX + 60, 0, scX + scW - 60, 0);
    ec.addColorStop(0, "rgba(255,255,255,0)");
    ec.addColorStop(.5, "rgba(255,255,255,.35)");
    ec.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = ec;
    ctx.fillRect(scX + 60, scY - 1, scW - 120, 1);

    // inner panel
    var pnX = scX + 22, pnY = scY + 22, pnW = scW - 44, pnH = scH - 44;
    ctx.fillStyle = "#0b0b11";
    rr(ctx, pnX, pnY, pnW, pnH, 20);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    rr(ctx, pnX, pnY, pnW, pnH, 20);
    ctx.stroke();

    // feeds
    var cx = W / 2, padT = 30, gap = 24;
    var y1 = pnY + padT;
    var y2 = y1 + 72 + gap;
    var y3 = y2 + 112 + gap;
    if (feeds["og-feed-enemy.png"].complete && feeds["og-feed-enemy.png"].naturalWidth)
      drawFeed(feeds["og-feed-enemy.png"], cx, y1, 72, { alpha: .62, dx: 14, filter: "saturate(.85)" });
    if (feeds["og-feed-revive.png"].complete && feeds["og-feed-revive.png"].naturalWidth)
      drawFeed(feeds["og-feed-revive.png"], cx, y2, 112, {
        dx: -2,
        shadow: ["rgba(255,70,85,.32)", 60, 26],
        shadow2: ["rgba(0,0,0,.6)", 18, 4]
      });
    if (feeds["og-feed-kill.png"].complete && feeds["og-feed-kill.png"].naturalWidth)
      drawFeed(feeds["og-feed-kill.png"], cx, y3, 72, { alpha: .62, dx: -14, filter: "saturate(.85)" });

    // dramatic vignette (over content, under credit)
    ctx.save();
    ctx.translate(W / 2, H * .47);
    ctx.scale(1, .68);
    var vg = ctx.createRadialGradient(0, 0, 0, 0, 0, W * .78);
    vg.addColorStop(.42, "rgba(0,0,0,0)");
    vg.addColorStop(.68, "rgba(0,0,0,.30)");
    vg.addColorStop(1, "rgba(0,0,0,.74)");
    ctx.fillStyle = vg;
    ctx.fillRect(-W, -H * 1.5, W * 2, H * 3);
    ctx.restore();

    // uniform fine grain
    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = .16;
    var pat = ctx.createPattern(fineGrain, "repeat");
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, W, H);

    // coarse grain swallowed by the edges (noise-texture vignette)
    var edge = document.createElement("canvas");
    edge.width = W; edge.height = H;
    var eg = edge.getContext("2d");
    eg.fillStyle = eg.createPattern(coarseGrain, "repeat");
    eg.fillRect(0, 0, W, H);
    eg.globalCompositeOperation = "destination-in";
    eg.translate(W / 2, H * .47);
    eg.scale(1, .68);
    var msk = eg.createRadialGradient(0, 0, 0, 0, 0, W * .78);
    msk.addColorStop(.38, "rgba(0,0,0,0)");
    msk.addColorStop(.70, "rgba(0,0,0,.85)");
    msk.addColorStop(1, "rgba(0,0,0,1)");
    eg.fillStyle = msk;
    eg.fillRect(-W, -H * 1.5, W * 2, H * 3);
    ctx.globalAlpha = .55;
    ctx.drawImage(edge, 0, 0);
    ctx.restore();

    // credit — bottom centre, crisp over everything
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    var fs = 16, fy = 872;
    ctx.font = "500 " + fs + "px Inter, system-ui, sans-serif";
    var s1 = "made with ", s2 = " by ", s3 = "mr_velosofy";
    var w1 = ctx.measureText(s1).width, w2 = ctx.measureText(s2).width,
        w3b = ctx.measureText(s3).width, hs = 17;
    var sx = W / 2 - (w1 + hs + w2 + w3b) / 2;
    ctx.fillStyle = "#8d95a3";
    ctx.fillText(s1, sx, fy);
    ctx.save();
    ctx.shadowColor = "rgba(255,70,85,.8)";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ff4655";
    heartPath(sx + w1 + hs / 2, fy - fs + 2, hs);
    ctx.fill();
    ctx.restore();
    var tx2 = sx + w1 + hs;
    ctx.fillStyle = "#8d95a3";
    ctx.fillText(s2, tx2, fy);
    ctx.fillStyle = "#d7dbe2";
    ctx.font = "700 " + fs + "px Inter, system-ui, sans-serif";
    ctx.fillText(s3, tx2 + w2, fy);
  }

  render(); // instant paint (fallbacks)
  Promise.all([logoReady, feedsReady]).then(render);
  fontsReady.then(function () { render(); setTimeout(render, 60); }); // repaint with Inter

  /* ── export ─────────────────────────────────────────── */
  var capBtn = document.getElementById("cap");

  function save(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 800);
    capBtn.textContent = "SAVE IMAGE";
    capBtn.disabled = false;
  }

  capBtn.addEventListener("click", function () {
    capBtn.disabled = true;
    capBtn.textContent = "RENDERING…";
    // canvas IS the composition — export is pixel-identical by definition
    try {
      cv.toBlob(function (blob) {
        if (blob) return save(blob, "og-image.webp");
        pngFallback();
      }, "image/webp", 0.92);
    } catch (e) { pngFallback(); }
  });

  function pngFallback() {
    cv.toBlob(function (b) { if (b) save(b, "og-image.png"); else resetBtn(); }, "image/png");
  }
  function resetBtn() { capBtn.textContent = "SAVE IMAGE"; capBtn.disabled = false; }
</script>
</body>
</html>

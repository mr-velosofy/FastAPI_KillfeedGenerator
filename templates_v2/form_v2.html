<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KILLFEED GENERATOR</title>
  <link rel="stylesheet" href="/static_v2/style.css?v={{ css_version }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
</head>

<body>
  <div class="app">

    <!-- PREVIEW PANEL -->
    <div class="preview-panel" id="preview-box">
      <div class="preview-topbar">
        <span class="preview-meta">// PREVIEW COMPOSITION</span>
        <span class="preview-live"><span class="live-dot"></span>LIVE</span>
      </div>
      <div class="preview-body">
        <div class="preview-image-wrap">
          <img src="{{ image_url or '' }}" alt="Preview" id="preview-img" class="preview-img">
        </div>
      </div>
    </div>

    <!-- SECTION HEADER -->
    <div class="section-header">
      <h2 class="section-title">SET UP KILL</h2>
      <div class="section-rule"></div>
    </div>

    <!-- ERROR -->
    {% if error %}
    <div class="error-bar">{{ error }}</div>
    {% endif %}

    <!-- CONFIGURATION PANEL -->
    <div class="config-panel">

      <!-- LOADOUT TYPE -->
      <div class="loadout-group">
        <span class="label-tiny">LOADOUT TYPE</span>
        <div class="segmented">
          <button type="button" class="seg-btn active" data-tab="weapons">GUNS</button>
          <button type="button" class="seg-btn" data-tab="abilities">ABILITIES</button>
          <button type="button" class="seg-btn" data-tab="special">SPECIAL</button>
        </div>
      </div>

      <form novalidate onsubmit="return false;">

        <!-- ALL INPUTS ONE ROW -->
        <div class="inputs-row">
          <div class="input-item" id="killer-group">
            <span class="label-tiny" id="killer-name-label">NICK(P1)</span>
            <input type="text" name="killer_name" id="killer_name" value="{{ form.killer_name }}" placeholder="PLAYER">
            <div class="field-error" id="killer_name_error"></div>
          </div>
          <div class="input-item" id="victim-group">
            <span class="label-tiny">NICK(P2)</span>
            <input type="text" name="victim_name" id="victim_name" value="{{ form.victim_name }}" placeholder="PLAYER">
            <div class="field-error" id="victim_name_error"></div>
          </div>
          <div class="input-item cdrop-wrap" id="killer-agent-group">
            <span class="label-tiny" id="killer-agent-label">AGENT(P1)</span>
            <div class="cdrop" data-for="killer_agent"></div>
            <select name="killer_agent" id="killer_agent" style="display:none">
              {% for agent in agents %}
              <option value="{{ agent }}" {% if form.killer_agent==agent %}selected{% endif %}>{{ agent }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="input-item cdrop-wrap" id="victim-agent-group">
            <span class="label-tiny">AGENT(P2)</span>
            <div class="cdrop" data-for="victim_agent"></div>
            <select name="victim_agent" id="victim_agent" style="display:none">
              {% for agent in agents %}
              <option value="{{ agent }}" {% if form.victim_agent==agent %}selected{% endif %}>{{ agent }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="input-item cdrop-wrap grow2" id="weapon-group">
            <span class="label-tiny">WEAPON</span>
            <div class="cdrop" data-for="weapon"></div>
            <select name="weapon" id="weapon-select" style="display:none"></select>
          </div>
          <div class="input-item narrow" id="numeral-group">
            <span class="label-tiny">KILLS</span>
            <div class="stepper">
              <button type="button" class="stepper-btn" id="stepper-minus">&minus;</button>
              <span class="stepper-value" id="stepper-value">0</span>
              <button type="button" class="stepper-btn" id="stepper-plus">+</button>
              <input type="hidden" name="numeral" id="numeral-input" value="{{ form.numeral or '' }}">
            </div>
          </div>
        </div>

        <!-- CHECKBOXES ANOTHER ROW -->
        <div class="checkbox-row">
          <label class="checkbox-box" id="hs-toggle">
            <input type="checkbox" name="is_headshot" {% if form.is_headshot %}checked{% endif %}>
            <span class="checkbox-label">HEADSHOT</span>
          </label>
          <label class="checkbox-box" id="wb-toggle">
            <input type="checkbox" name="is_wallbang" {% if form.is_wallbang %}checked{% endif %}>
            <span class="checkbox-label">WALLBANG</span>
          </label>
          <label class="checkbox-box">
            <input type="checkbox" name="is_self_kill" id="is_self_kill" {% if form.is_self_kill %}checked{% endif %}>
            <span class="checkbox-label">SUICIDE</span>
          </label>
          <label class="checkbox-box">
            <input type="checkbox" name="is_enemy_kill" id="is_enemy_kill" {% if form.is_enemy_kill %}checked{% endif %}>
            <span class="checkbox-label">ENEMY KILL</span>
          </label>
          <label class="checkbox-box">
            <input type="checkbox" name="is_player_kill" {% if form.is_player_kill %}checked{% endif %}>
            <span class="checkbox-label">ME HIGHLIGHT</span>
          </label>
        </div>

        <!-- EXPORT -->
        <button type="button" class="btn-export" onclick="downloadPreview()">EXPORT PNG</button>

      </form>
    </div>



  </div>

  <script>
    var weaponsList = {{ weapons | tojson }};
    var abilitiesList = {{ abilities | tojson }};
    var specialList = {{ special | tojson }};
    var allTabs = { weapons: weaponsList, abilities: abilitiesList, special: specialList };
    var activeTab = "weapons";

    function displayName(path) {
      var name = path.split(/[/\\]/).pop();
      return name.replace(/\.png$/i, "").replace(/_/g, " ");
    }

    function detectTab(path) {
      if (/(^|[/\\])weapons[/\\]/.test(path)) return "weapons";
      if (/(^|[/\\])abilities[/\\]/.test(path)) return "abilities";
      if (/(^|[/\\])special[/\\]/.test(path)) return "special";
      return "weapons";
    }

    // ── Custom Dropdown ──────────────────────────────────────────

    function buildCustomDropdown(selectEl) {
      var wrapper = selectEl.parentElement.querySelector('.cdrop');
      if (!wrapper) return;
      var isWeapon = selectEl.id === 'weapon-select';
      var getImgSrc, getText;

      if (isWeapon) {
        getImgSrc = function (val) { return val ? '/assets/' + val : ''; };
        getText = function (val) { return val ? displayName(val) : ''; };
      } else {
        getImgSrc = function (val) {
          if (!val) return '';
          var fix = { 'KAYO': 'Kayo', 'Iso': 'ISO' };
          return '/assets/agents-icon/' + (fix[val] || val) + '.png';
        };
        getText = function (val) { return val || ''; };
      }

      function renderTrigger(selectedVal) {
        var imgSrc = getImgSrc(selectedVal);
        var text = getText(selectedVal);
        wrapper.innerHTML =
          '<div class="cdrop-trigger" tabindex="0">' +
            (imgSrc ? '<img class="cdrop-img" src="' + imgSrc + '" alt="">' : '<span class="cdrop-img cdrop-img-placeholder"></span>') +
            '<span class="cdrop-text">' + text + '</span>' +
            '<span class="cdrop-arrow"></span>' +
          '</div>';
        wrapper.querySelector('.cdrop-trigger').addEventListener('click', function (e) {
          e.stopPropagation();
          toggleMenu(selectEl);
        });
      }

      function renderMenu(selectedVal, filterTab) {
        var existing = wrapper.querySelector('.cdrop-menu');
        if (existing) existing.remove();

        var menu = document.createElement('div');
        menu.className = 'cdrop-menu';
        var items = [];

        if (isWeapon) {
          var list = allTabs[filterTab || activeTab] || [];
          list.forEach(function (item) {
            items.push({ value: item, img: getImgSrc(item), text: getText(item) });
          });
        } else {
          var options = selectEl.querySelectorAll('option');
          options.forEach(function (opt) {
            items.push({ value: opt.value, img: getImgSrc(opt.value), text: getText(opt.value) });
          });
        }

        if (items.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'cdrop-empty';
          empty.textContent = 'No items';
          menu.appendChild(empty);
          wrapper.appendChild(menu);
          return;
        }

        items.forEach(function (item) {
          var opt = document.createElement('div');
          opt.className = 'cdrop-opt' + (item.value === selectedVal ? ' selected' : '');
          opt.setAttribute('data-value', item.value);
          opt.innerHTML =
            (item.img ? '<img class="cdrop-opt-img" src="' + item.img + '" alt="">' : '<span class="cdrop-opt-img cdrop-opt-img-placeholder"></span>') +
            '<span>' + item.text + '</span>';
          opt.addEventListener('click', function (e) {
            e.stopPropagation();
            selectVal(selectEl, item.value);
            closeAllDropdowns();
          });
          menu.appendChild(opt);
        });
        wrapper.appendChild(menu);
      }

      function selectVal(sel, val) {
        sel.value = val;
        sel.dispatchEvent(new Event('change', { bubbles: true }));
        renderTrigger(val);
        rebuildWeaponOptionsOnTab(); // refresh menu for next open
      }

      function toggleMenu(sel) {
        var menu = wrapper.querySelector('.cdrop-menu');
        if (menu) {
          menu.remove();
          return;
        }
        closeAllDropdowns();
        var val = sel.value;
        var tab = isWeapon ? activeTab : null;
        renderMenu(val, tab);
        menu = wrapper.querySelector('.cdrop-menu');
        if (menu) {
          menu.style.display = 'block';
        }
      }

      // build initial trigger
      renderTrigger(selectEl.value);

      // store rebuild function on wrapper for tab changes
      wrapper._rebuild = function () {
        renderTrigger(selectEl.value);
        var menu = wrapper.querySelector('.cdrop-menu');
        if (menu) {
          var tab = isWeapon ? activeTab : null;
          renderMenu(selectEl.value, tab);
        }
      };

      return wrapper;
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.cdrop-menu').forEach(function (m) { m.remove(); });
    }

    document.addEventListener('click', function () {
      closeAllDropdowns();
    });

    // ── Init Custom Dropdowns ────────────────────────────────────

    function initAllDropdowns() {
      buildCustomDropdown(document.getElementById('killer_agent'));
      buildCustomDropdown(document.getElementById('victim_agent'));
      buildCustomDropdown(document.getElementById('weapon-select'));
    }

    function rebuildWeaponOptionsOnTab() {
      var dd = document.querySelector('.cdrop[data-for="weapon"]');
      if (dd && dd._rebuild) dd._rebuild();
    }

    // ── Tab switching ────────────────────────────────────────────

    var tabButtons = document.querySelectorAll(".seg-btn");
    tabButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        tabButtons.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        activeTab = btn.getAttribute("data-tab");
        populateSelect(activeTab);
        rebuildWeaponOptionsOnTab();
        setTimeout(triggerPreview, 50);
      });
    });

    function populateSelect(tab) {
      var select = document.getElementById("weapon-select");
      select.innerHTML = "";
      var items = allTabs[tab] || [];
      items.forEach(function (item) {
        var opt = document.createElement("option");
        opt.value = item;
        opt.textContent = displayName(item);
        select.appendChild(opt);
      });
      // keep first item selected if no value
      if (submittedWeapon && tab === detectTab(submittedWeapon)) {
        select.value = submittedWeapon;
      }
    }

    var submittedWeapon = {{ form.get("weapon", none) | tojson }};
    if (submittedWeapon) {
      activeTab = detectTab(submittedWeapon);
    }
    populateSelect(activeTab);
    tabButtons.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === activeTab);
    });
    if (submittedWeapon) {
      document.getElementById("weapon-select").value = submittedWeapon;
    }

    // ── Stepper ──────────────────────────────────────────────────

    var stepperValue = 0;
    var stepperDisplay = document.getElementById("stepper-value");
    var numeralInput = document.getElementById("numeral-input");

    function initStepper() {
      var val = numeralInput.value;
      if (val === "3") stepperValue = 3;
      else if (val === "4") stepperValue = 4;
      else if (val === "5") stepperValue = 5;
      else if (val === "6") stepperValue = 6;
      else if (val === "7") stepperValue = 7;
      else stepperValue = 0;
      updateStepper();
    }

    function updateStepper() {
      stepperDisplay.textContent = stepperValue;
      if (stepperValue >= 3 && stepperValue <= 7) {
        numeralInput.value = String(stepperValue);
      } else {
        numeralInput.value = "";
      }
    }

    document.getElementById("stepper-minus").addEventListener("click", function () {
      var allowed = [0, 3, 4, 5, 6, 7];
      var idx = allowed.indexOf(stepperValue);
      if (idx > 0) {
        stepperValue = allowed[idx - 1];
        updateStepper();
        triggerPreview();
      }
    });

    document.getElementById("stepper-plus").addEventListener("click", function (e) {
      e.stopPropagation();
      var allowed = [0, 3, 4, 5, 6, 7];
      var idx = allowed.indexOf(stepperValue);
      if (idx >= 0 && idx < allowed.length - 1) {
        stepperValue = allowed[idx + 1];
        updateStepper();
        triggerPreview();
      }
    });

    initStepper();

    // ── Self-kill toggle ─────────────────────────────────────────

    var selfKillCheck = document.getElementById("is_self_kill");
    var killerNameInput = document.getElementById("killer_name");
    var victimNameInput = document.getElementById("victim_name");
    var killerAgentSelect = document.getElementById("killer_agent");
    var victimAgentSelect = document.getElementById("victim_agent");
    var enemyKillCheck = document.getElementById("is_enemy_kill");

    function toggleSelfKill() {
      var isSelf = selfKillCheck.checked;
      document.getElementById("victim-group").style.display = isSelf ? "none" : "";
      document.getElementById("victim-agent-group").style.display = isSelf ? "none" : "";
      document.getElementById("numeral-group").style.display = isSelf ? "none" : "";
      document.getElementById("hs-toggle").style.display = isSelf ? "none" : "";
      document.getElementById("wb-toggle").style.display = isSelf ? "none" : "";
      enemyKillCheck.closest(".checkbox-box").style.display = isSelf ? "none" : "";
      document.getElementById("killer-name-label").textContent = isSelf ? "NAME" : "NICK(P1)";
      document.getElementById("killer-agent-label").textContent = isSelf ? "AGENT" : "AGENT(P1)";
      if (isSelf) {
        enemyKillCheck.checked = false;
        if (!killerNameInput.value) killerNameInput.value = "PLAYER";
        victimNameInput.value = killerNameInput.value;
        victimAgentSelect.value = killerAgentSelect.value;
      }
    }

    selfKillCheck.addEventListener("change", toggleSelfKill);
    killerNameInput.addEventListener("input", function () {
      if (selfKillCheck.checked) victimNameInput.value = this.value;
    });
    killerAgentSelect.addEventListener("change", function () {
      if (selfKillCheck.checked) victimAgentSelect.value = this.value;
    });
    enemyKillCheck.addEventListener("change", function () {
      if (this.checked) selfKillCheck.checked = false;
    });

    toggleSelfKill();

    // ── Live preview ─────────────────────────────────────────────

    var previewImg = document.getElementById("preview-img");
    var debounceTimer;

    function collectFormData() {
      var form = document.querySelector("form");
      var params = new URLSearchParams();
      [].slice.call(form.querySelectorAll("input, select")).forEach(function (el) {
        if (el.type === "checkbox") {
          if (el.checked) params.append(el.name, "true");
        } else if (el.name) {
          params.append(el.name, el.value);
        }
      });
      return params;
    }

    function triggerPreview() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () {
        var params = collectFormData();
        var url = "/api/preview?" + params.toString();
        previewImg.src = url + "&t=" + Date.now();
      }, 300);
    }

    document.querySelectorAll("input, select").forEach(function (el) {
      el.addEventListener("input", triggerPreview);
      el.addEventListener("change", triggerPreview);
    });

    // ── Download ─────────────────────────────────────────────────

    function downloadPreview() {
      var params = collectFormData();
      var url = "/api/preview?" + params.toString() + "&t=" + Date.now() + "&download=true";
      var a = document.createElement('a');
      a.href = url;
      a.download = 'killfeed.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // ── Init ─────────────────────────────────────────────────────

    initAllDropdowns();
    setTimeout(triggerPreview, 100);

    // ── Validation ───────────────────────────────────────────────

    function validateForm() {
      var valid = true;
      document.querySelectorAll(".field-error").forEach(function (el) { el.innerText = ""; });
      if (!selfKillCheck.checked) {
        var k = killerNameInput.value.trim();
        var v = victimNameInput.value.trim();
        if (!k) {
          document.getElementById("killer_name_error").innerText = "ENTER A KILLER NAME";
          valid = false;
        }
        if (!v) {
          document.getElementById("victim_name_error").innerText = "ENTER A VICTIM NAME";
          valid = false;
        }
      }
      return valid;
    }
  </script>
</body>

</html>
